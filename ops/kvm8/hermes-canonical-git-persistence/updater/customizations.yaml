id: CUSTOM_15
title: Hindsight updater lifecycle repair (relocation gate, explicit rollback, terminal state)
tier: T2.5
task: KVM8_HINDSIGHT_T2_5_UPDATER_POST_PROMOTION_GATE_AND_ROLLBACK_REPAIR
status: applied
owner: hermes-kvm8
applied_at_utc: "2026-09-28"
target_host_file: /usr/local/bin/hindsight-update-safe.sh
problem: |
  Three lifecycle defects made a SUCCESSFUL fork promotion report failure.
  (A) validate_release_identity scanned the whole venv for the literal token
  "candidate-". Measured on the certified production release it matched 6
  legitimate files including hindsight_api/engine/memories/pg/graph.py, and the
  official prod-0.10.1 environment triggers the same false positive, so the
  gate was unsatisfiable by construction: no valid release could pass it. The
  promotion therefore exited 1 after a correct swap, exit code 1, leaving
  update-state.json permanently IN_PROGRESS.
  (B) --rollback-to-official could not revert 0.10.1+mastertrend.t22.1 ->
  0.10.1 because the anti-regression guard correctly reports
  0.10.1 < 0.10.1+mastertrend.t22.1 in PEP 440. The guard was RIGHT for updates;
  the missing thing was operation semantics, not a weaker guard.
  (C) update-state.json was rewritten only on the success path, so any exit
  after the symlink swap left IN_PROGRESS forever.
fix: |
  The shell now DELEGATES; it no longer reimplements any of this.
    relocation_gate.py  semantic relocation validation (8 path facts)
    lifecycle.py        admission of explicit rollback + terminal run state
  Each decision has one implementation, unit-tested against fixtures, and
  invoked identically by the shell, the timer and the acceptance suite.
relocation_gate: |
  REPLACED: grep -R --fixed-strings "candidate-" <release>/venv
  A relocation is a PATH fact, not a token fact. Checks: VENV_PRESENT,
  PREFIX_CHECK, EXECUTABLE_CHECK, SHEBANG_CHECK, LAUNCHER_PREFIX,
  CONSOLE_SCRIPT, STAGING_REF, PYVENV_CFG, RUNTIME_PATHS. site-packages is
  never lexically scanned. The lexical scan survives only in scoped form, over
  files that can carry a PATH VALUE, for the concrete staging path.
relocation_gate_hardening: |
  ROOT is a PARAMETER (--root, default /opt/hindsight-kvm8). An earlier draft
  hardcoded it, which silently no-op'd every path check under any other root and
  made the negative fixtures report PASS on genuinely relocated releases.
  LAUNCHER_PREFIX asks the interpreter a launcher NAMES for its own prefix
  rather than inferring from path shape. Measured on this host: symlinking
  venv/bin/python at a foreign venv does NOT move sys.prefix, because CPython
  reads the pyvenv.cfg adjacent to the INVOKED path.
  pyvenv.cfg provenance (`command = ...`) is exempt from finality but not from
  staging: the certified fork was built from the official 0.10.1 venv, and a
  gate that rejected that parent would reject the release it just promoted.
rollback_semantics: |
  ROLLBACK_OPERATION_MODE=EXPLICIT_ROLLBACK, reachable ONLY via
  --rollback-to-official. The anti-regression guard is NOT weakened: an ordinary
  update still requires target >= current, proven by T2/SBX8 on the identical
  transition. The global range gate runs FIRST and unconditionally, so no
  rollback can reach outside [0.10.0, 0.11.0). Seven preconditions: target
  below current, no fork local label, source OFFICIAL_UPSTREAM, explicitly
  resolved (never autodiscovered), >= canonical floor, release already exists
  (a rollback restores, it never builds), and exact release identity.
  There is deliberately NO ALLOW_DOWNGRADE switch: an env-exportable flag would
  let a plain `timer --apply` disable the protection.
source_mode_transaction: |
  Runtime and desired source move together: snapshot both, write desired source
  first, swap symlink, update previous, verify, check service. Any failure
  restores BOTH, so the end state is the pre-transaction one. The two forbidden
  mixed states (official runtime + fork desired source, and the reverse) are
  not observable after a completed transaction. This function is the ONLY way
  the updater writes desired source.
terminal_state: |
  settle_state() runs from the trap EXIT on EVERY exit path. IN_PROGRESS is
  never terminal. Vocabulary is the updater's existing family plus the single
  missing member FAILED_POST_PROMOTION (promotion committed, post-promotion
  check failed) -- distinct from FAIL_ROLLED_BACK, which means the updater put
  the old release back. A run that does not know its classification and exits 0
  defaults conservatively to PASS_NO_UPDATE, never to PASS_UPDATED.
invariants: |
  - valid releases no longer fail because of innocent candidate- tokens
  - real staging-path leakage still fails
  - explicit rollback-to-official works in sandbox
  - normal downgrade remains blocked without the flag
  - source-mode transition is transactional
  - no completed updater path leaves permanent IN_PROGRESS
  - current fork survives timer no-op
  - missing fork still fails closed
  - production remains on fork and healthy
fail_closed: |
  relocation_gate.py absent -> updater exits 70 before any operation. A missing
  gate must never degrade into "no relocation check". lifecycle.py absent ->
  state settlement logs WARN and does not change the exit code. Fork without
  artifact/hash/provenance -> BLOCKED_SOURCE_PROVENANCE, exit 2, zero mutation.
tests:
  relocation_r1_r8: 8
  transition_t1_t15: 15
  source_mode_txn_x1_x3: 3
  terminal_state_s1_s7: 7
  sandbox_rollback_sbx1_sbx8: 8
  acceptance_total: 35
  no_regression_custom_13: 69
  no_regression_custom_14: 17
reconciler: customizations/CUSTOM_15/relocation_gate.py
acceptance: customizations/CUSTOM_15/test_lifecycle.py
sandbox: customizations/CUSTOM_15/sandbox_rollback.py
evidence: /root/hermes-audits/kvm8-hindsight-t2-5-updater-lifecycle-repair-20260928T143603Z
