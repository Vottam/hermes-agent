id: CUSTOM_14
title: Deterministic fail-closed Hindsight staging environment
tier: T2.5
task: KVM8_HINDSIGHT_T2_5_STAGING_HARNESS_ENV_REPAIR
status: applied
owner: hermes-kvm8
applied_at_utc: "2026-09-28"
target_host_file: /usr/local/bin/hindsight-update-safe.sh
policy: EXPLICIT_WHITELIST_FAIL_CLOSED
problem: |
  The staging block exported 4 HINDSIGHT_API_* vars and scraped
  HINDSIGHT_API_LLM_API_KEY via grep|cut, while /etc/hindsight-kvm8/daemon.env
  carries 16 HINDSIGHT_API_LLM* keys. The 15 missing keys let hindsight_api
  config.py select its hardcoded DEFAULT_LLM_PROVIDER=openai /
  DEFAULT_LLM_MODEL=gpt-4o-mini, shipping the OpenRouter key to
  api.openai.com -> HTTP 401 -> retain fact extraction failed.
  The harness was also non-deterministic: the systemd unit has
  EnvironmentFile=-/etc/hindsight-kvm8/daemon.env, so under the timer the
  staging inherited all 16 keys by accident while an interactive shell did not.
desired_state: |
  - single canonical source, the daemon EnvironmentFile
  - parsed as a systemd-style env file, never sourced
  - explicit whitelist; DATABASE_URL, PORT, LOG_LEVEL always staging-owned
  - 8 required core LLM keys; missing or empty fails BEFORE launch
  - launch via env -i with an explicit key list; nothing inherited
  - values never logged; presence and counts only
invariants: |
  - PROVIDER_CALLS=0 when a required key is missing
  - no implicit openai/gpt-4o-mini fallback is reachable
  - identical result under normal root, minimal timer, and hostile vars
gate_not_weakened: |
  REAL_LLM_REQUIRED_FOR_STAGING=yes. Staging still requires a real LLM for
  retain fact extraction, sentinel recall and non-empty reflect.
reconciler: customizations/CUSTOM_14/reconcile.py
acceptance: customizations/CUSTOM_14/test_staging_env.py
tests:
  fail_closed_missing_required_key: 8
  fail_closed_empty_value: 1
  fail_closed_unreadable_source: 1
  environment_independence_scenarios: 2
  ab_equivalence: 1
  acceptance_total: 17
